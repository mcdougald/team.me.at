<svg xmlns="http://www.w3.org/2000/svg" width="880" height="281" viewBox="0 0 880 281" role="img" aria-label="team.me.at at a glance: Curated roster, Consent first, Enrichment never adds, Ways to join">
<rect x="0.5" y="0.5" width="879" height="280" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
<rect x="24" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="44" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">01</text>
<line x1="72" y1="56" x2="200" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="44" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="44" dy="0">Curated roster</tspan></text>
<text x="44" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="44" dy="0">Adding a person is a</tspan><tspan x="44" dy="21">data edit, not a</tspan><tspan x="44" dy="21">layout change, and</tspan><tspan x="44" dy="21">each entry links to</tspan><tspan x="44" dy="21">their GitHub or site.</tspan></text>
<rect x="236" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="256" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">02</text>
<line x1="284" y1="56" x2="412" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="256" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="256" dy="0">Consent first</tspan></text>
<text x="256" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="256" dy="0">Nobody is published</tspan><tspan x="256" dy="21">without opting in,</tspan><tspan x="256" dy="21">and a withdrawal</tspan><tspan x="256" dy="21">removes them from the</tspan><tspan x="256" dy="21">public roster.</tspan></text>
<rect x="448" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="468" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">03</text>
<line x1="496" y1="56" x2="624" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="468" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="468" dy="0">Enrichment</tspan><tspan x="468" dy="22">never adds</tspan></text>
<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="468" dy="0">Optional GitHub data</tspan><tspan x="468" dy="21">decorates people</tspan><tspan x="468" dy="21">already listed but</tspan><tspan x="468" dy="21">can never add one. It</tspan><tspan x="468" dy="21">is cached.</tspan></text>
<rect x="660" y="24" width="196" height="233" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
<text x="680" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a3a3a3">04</text>
<line x1="708" y1="56" x2="836" y2="56" stroke="#d4d4d4" stroke-width="1"/>
<text x="680" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0a0a0a" font-weight="600"><tspan x="680" dy="0">Ways to join</tspan></text>
<text x="680" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#525252"><tspan x="680" dy="0">Calls to action route</tspan><tspan x="680" dy="21">to meet.me.at,</tspan><tspan x="680" dy="21">hire.me.at and GitHub</tspan><tspan x="680" dy="21">instead of an</tspan><tspan x="680" dy="21">application form.</tspan></text>
</svg>
